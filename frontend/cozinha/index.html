<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shalon — Cozinha</title>
<meta name="theme-color" content="#1c8c5a">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icone-192.png">
<link rel="stylesheet" href="../comum/estilo.css">
<link rel="stylesheet" href="cozinha.css">
</head>
<body>

<!-- ============================================================== LOGIN -->
<section id="tela-login" class="login">
  <h1 class="login__marca">Shalon</h1>
  <p class="login__papel">Tela da cozinha</p>

  <div id="login-lista" class="login__caixa">
    <p class="login__titulo">Entrar como</p>
    <div id="usuarios" class="login__usuarios"></div>
    <p id="login-carregando" class="fraco">Carregando…</p>
    <button id="login-recarregar" class="botao botao--fantasma" hidden>Tentar de novo</button>
  </div>

  <div id="login-pin" class="login__caixa" hidden>
    <button id="pin-voltar" class="login__voltar">‹ Trocar</button>
    <p class="login__titulo"><span id="pin-nome"></span>, digite o PIN</p>

    <!-- Esta tela vive num PC com teclado, diferente do celular do balcão:
         não precisa do teclado numérico desenhado. -->
    <input id="pin-campo" class="login__pin" type="password" inputmode="numeric"
           autocomplete="off" maxlength="72" aria-label="PIN">

    <p id="login-erro" class="login__erro" hidden></p>
    <button id="pin-entrar" class="botao login__entrar">ENTRAR</button>

    <p class="fraco login__nota">
      O PC da cozinha fica logado: a sessão dura 60 dias e volta sozinha
      depois de reiniciar.
    </p>
  </div>
</section>

<!-- ============================================================= COMANDAS -->
<section id="tela-cozinha" class="cozinha" hidden>

  <header class="topo">
    <span class="topo__marca">Shalon <b>Cozinha</b></span>

    <span class="topo__contas">
      <span class="conta conta--recebido"><b id="c-recebido">0</b> na fila</span>
      <span class="conta conta--preparo"><b id="c-preparo">0</b> em preparo</span>
      <span class="conta conta--pronto"><b id="c-pronto">0</b> prontas</span>
    </span>

    <button id="btn-som" class="topo__acao" aria-pressed="true"
            title="Aviso sonoro quando entra comanda nova">🔔</button>
    <span class="topo__relogio" id="relogio">--:--</span>
    <button id="btn-usuario" class="topo__usuario">
      <span class="ponto" id="ponto-conexao"></span>
      <span id="nome-usuario"></span>
    </button>
  </header>

  <div id="faixa-conexao" class="faixa faixa--erro" hidden></div>

  <main id="comandas" class="comandas"></main>

  <p id="vazio" class="vazio" hidden>
    <span class="vazio__icone">🍦</span>
    Nenhuma comanda em produção.
  </p>
</section>

<!-- ============================================================== PAINEL -->
<div id="painel" class="painel" hidden>
  <div class="painel__fundo" data-fechar></div>

  <div class="painel__folha">
    <p class="painel__titulo" id="painel-usuario-nome"></p>
    <p class="fraco" id="painel-nota"></p>
    <button id="btn-entregues" class="botao botao--fantasma">Ver entregues de hoje</button>
    <button id="btn-sair" class="botao botao--perigo">Sair</button>
    <button class="botao botao--fantasma" data-fechar>Fechar</button>
  </div>
</div>

<div id="aviso" class="aviso" role="status" aria-live="polite"></div>

<script type="module" src="app.js"></script>
</body>
</html>
